<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#dff4ff"><title>我的｜月經小日記</title><style>
:root{--b:#dff4ff;--b2:#bfe9ff;--d:#5b9fbe;--i:#35566a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#dff4ff,#f8fdff);font-family:-apple-system,BlinkMacSystemFont,"PingFang TC",sans-serif;color:var(--i)}.app{max-width:520px;margin:auto;min-height:100vh;padding:18px 16px 90px}header{display:flex;justify-content:space-between;align-items:center;padding:8px 4px 18px}.logo{font-size:28px;font-weight:800}.sub{font-size:12px;opacity:.7}.bunny{font-size:36px}.card{background:#fff;border:1px solid #d5effa;border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 8px 24px #4896be14}.hero{background:linear-gradient(135deg,#c8efff,#edfaff)}h2{margin:0 0 8px;font-size:20px}.big{font-size:36px;font-weight:800;color:var(--d)}button{border:0;border-radius:16px;padding:12px 15px;background:var(--b2);color:var(--i);font-weight:700;font-size:15px}.row{display:flex;gap:10px}.row>*{flex:1}input,select,textarea{width:100%;padding:12px;border:1px solid #cfeaf5;border-radius:14px;background:#fff;font:inherit;color:var(--i)}textarea{min-height:80px}.label{font-size:13px;margin:10px 0 6px;opacity:.8}.head{display:flex;justify-content:space-between;align-items:center}.week,.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.week div{text-align:center;font-size:11px;opacity:.55}.day{aspect-ratio:1;border-radius:13px;background:#f5fbfe;display:flex;align-items:center;justify-content:center;font-size:13px;position:relative}.day.p{background:#bfe9ff;font-weight:800}.day.s{outline:2px solid var(--d)}.dot{position:absolute;bottom:4px;width:5px;height:5px;border-radius:50%;background:#ef9fbd}nav{position:fixed;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid #d8eff8;display:flex;justify-content:center;gap:8px;padding:10px 0 calc(10px + env(safe-area-inset-bottom))}nav button{background:transparent;padding:8px 14px;font-size:12px}.active{color:var(--d);font-weight:800}.small{font-size:12px;opacity:.7}.hidden{display:none}.pill{display:inline-block;background:#edf9ff;padding:7px 10px;border-radius:99px;margin:3px;font-size:12px}.record-item{padding:12px 0;border-bottom:1px solid #e7f5fa}.record-item:last-child{border-bottom:0}.actions{display:flex;gap:8px;margin-top:8px}.actions button{padding:8px 12px;font-size:13px}.edit{background:#dff4ff}.del{background:#ffe8f0}
</style></head><body><div class="app"><header><div><div class="logo">我的 🎀</div><div class="sub">月經小日記 · 淡藍兔兔版</div></div><div class="bunny">🐰</div></header>
<section id="home"><div class="card hero"><div class="small">下次經期預估</div><div id="next" class="big">—</div><div id="count" class="small">先記錄一次經期吧</div></div><div class="card"><h2>今天有來嗎？ 🌙</h2><div class="row"><button onclick="quickStart()">🩵 今天開始</button><button onclick="quickEnd()">🌸 今天結束</button></div></div><div class="card"><h2>最近紀錄</h2><div id="recent" class="small">還沒有紀錄</div></div></section>
<section id="calendar" class="hidden"><div class="card"><div class="head"><button onclick="mv(-1)">‹</button><h2 id="month"></h2><button onclick="mv(1)">›</button></div><div class="week"><div>日</div><div>一</div><div>二</div><div>三</div><div>四</div><div>五</div><div>六</div></div><div id="grid" class="grid"></div></div></section>
<section id="record" class="hidden"><div class="card"><h2 id="recordTitle">新增經期紀錄 🌷</h2><div class="label">開始日期</div><input id="start" type="date"><div class="label">結束日期</div><input id="end" type="date"><div class="label">經血量</div><select id="flow"><option>少</option><option selected>中</option><option>多</option><option>超多</option></select><div class="label">症狀</div><div id="sym"></div><div class="label">備註</div><textarea id="note" placeholder="今天的心情、身體狀況……"></textarea><button id="saveBtn" style="width:100%;margin-top:12px" onclick="saveR()">💙 儲存紀錄</button><button id="cancelBtn" class="hidden" style="width:100%;margin-top:8px;background:#edf9ff" onclick="cancelEdit()">取消修改</button></div><div class="card"><h2>我的經期紀錄 ✨</h2><div id="recordList" class="small">還沒有紀錄</div></div></section>
<section id="stats" class="hidden"><div class="card"><h2>我的小統計 📊</h2><div id="statsText"></div></div></section></div><nav><button class="active" onclick="show('home',this)">🏠<br>首頁</button><button onclick="show('calendar',this)">📅<br>月曆</button><button onclick="show('record',this)">🌷<br>紀錄</button><button onclick="show('stats',this)">✨<br>統計</button></nav>
<script>
const K="my_period_records_v1";let rs=JSON.parse(localStorage.getItem(K)||"[]"),vd=new Date(),editingId=null;const sy=["腹痛","頭痛","腰痠","疲倦","情緒","食慾","其他"];sym.innerHTML=sy.map(x=>`<label class="pill"><input style="width:auto" type="checkbox" value="${x}"> ${x}</label>`).join("");
function save(){localStorage.setItem(K,JSON.stringify(rs))}function date(x){return new Date(x).toLocaleDateString("zh-TW",{year:"numeric",month:"numeric",day:"numeric"})}function days(a,b){return Math.round((new Date(b)-new Date(a))/86400000)}function avg(){if(rs.length<2)return 28;let a=[...rs].sort((x,y)=>new Date(x.start)-new Date(y.start)),d=[];for(let i=1;i<a.length;i++){let n=days(a[i-1].start,a[i].start);if(n>=21&&n<=45)d.push(n)}return d.length?Math.round(d.reduce((x,y)=>x+y)/d.length):28}
function render(){rs.sort((a,b)=>new Date(b.start)-new Date(a.start));let r=rs[0];if(r){let n=new Date(r.start);n.setDate(n.getDate()+avg());next.textContent=date(n);count.textContent="預估週期約 "+avg()+" 天"}recent.innerHTML=r?rs.slice(0,3).map(x=>`<div style="padding:9px 0">🌸 ${date(x.start)}${x.end?" ～ "+date(x.end):""} · ${x.flow}</div>`).join(""):"還沒有紀錄";recordList.innerHTML=rs.length?rs.map(x=>`<div class="record-item"><div><b>🌸 ${date(x.start)}${x.end?" ～ "+date(x.end):" ～ 尚未結束"}</b></div><div class="small">經血量：${x.flow}${x.symptoms&&x.symptoms.length?" · 症狀："+x.symptoms.join("、"):""}</div>${x.note?`<div class="small">備註：${x.note}</div>`:""}<div class="actions"><button class="edit" onclick="editR(${x.id})">✏️ 修改</button><button class="del" onclick="deleteR(${x.id})">🗑️ 刪除</button></div></div>`).join(""):"還沒有紀錄";let lens=rs.filter(x=>x.end).map(x=>days(x.start,x.end)+1),al=lens.length?Math.round(lens.reduce((a,b)=>a+b)/lens.length):0;statsText.innerHTML=`<p>平均週期：<b>${avg()} 天</b></p><p>平均經期：<b>${al?al+" 天":"尚無資料"}</b></p><p>已記錄：<b>${rs.length} 次</b></p><p class="small">預測僅供日常記錄參考，不是醫療診斷。</p>`;cal()}
function cal(){let y=vd.getFullYear(),m=vd.getMonth();month.textContent=`${y} 年 ${m+1} 月`;let f=new Date(y,m,1),n=new Date(y,m+1,0).getDate(),h="";for(let i=0;i<f.getDay();i++)h+="<div></div>";for(let d=1;d<=n;d++){let x=new Date(y,m,d),s=x.toISOString().slice(0,10),p=rs.some(r=>s>=r.start&&(!r.end||s<=r.end));h+=`<div class="day ${p?"p":""}">${d}${p?'<span class="dot"></span>':""}</div>`}grid.innerHTML=h}function mv(n){vd.setMonth(vd.getMonth()+n);cal()}
function show(id,b){["home","calendar","record","stats"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!=id));document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));b.classList.add("active");if(id=="record"&&!editingId){start.value=new Date().toISOString().slice(0,10)}}
function quickStart(){cancelEdit();show("record",document.querySelectorAll("nav button")[2])}function quickEnd(){if(!rs[0])return alert("請先新增經期");rs[0].end=new Date().toISOString().slice(0,10);save();render()}
function saveR(){if(!start.value)return alert("請選開始日期");if(end.value&&end.value<start.value)return alert("結束日期不能早於開始日期");const data={start:start.value,end:end.value,flow:flow.value,symptoms:[...document.querySelectorAll("#sym input:checked")].map(x=>x.value),note:note.value};if(editingId){const i=rs.findIndex(x=>x.id===editingId);if(i>=0)rs[i]={...rs[i],...data}}else{rs.push({id:Date.now(),...data})}save();render();cancelEdit();show("home",document.querySelector("nav button"))}
function editR(id){const r=rs.find(x=>x.id===id);if(!r)return;editingId=id;recordTitle.textContent="修改經期紀錄 ✏️";saveBtn.textContent="💙 儲存修改";cancelBtn.classList.remove("hidden");start.value=r.start||"";end.value=r.end||"";flow.value=r.flow||"中";note.value=r.note||"";document.querySelectorAll("#sym input").forEach(c=>c.checked=(r.symptoms||[]).includes(c.value));show("record",document.querySelectorAll("nav button")[2]);window.scrollTo({top:0,behavior:"smooth"})}
function cancelEdit(){editingId=null;recordTitle.textContent="新增經期紀錄 🌷";saveBtn.textContent="💙 儲存紀錄";cancelBtn.classList.add("hidden");start.value=new Date().toISOString().slice(0,10);end.value="";flow.value="中";note.value="";document.querySelectorAll("#sym input").forEach(c=>c.checked=false)}
function deleteR(id){const r=rs.find(x=>x.id===id);if(!r)return;if(confirm(`確定要刪除 ${date(r.start)} 的經期紀錄嗎？`)){rs=rs.filter(x=>x.id!==id);save();render()}}render();
</script></body></html>
